<title>Adel's Words</title>
<style>
  :root{
    --bg1:#fff6c9; --bg2:#ffe0f0;
    --red:#ff6b6b; --orange:#ffa94d; --yellow:#ffd43b; --green:#51cf66;
    --teal:#20c997; --blue:#4dabf7; --purple:#9775fa; --pink:#f783ac;
    --ink:#3b2f5c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    position:fixed;inset:0;width:100%;overflow:hidden;
    font-family:"Arial Rounded MT Bold","Nunito","Comic Sans MS","Chalkboard SE","Geeza Pro","Noto Naskh Arabic","Noto Sans Arabic","Al Bayan","Baghdad","Segoe UI","Tahoma","Arial",system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 20% 10%,var(--bg1),var(--bg2) 70%);
    color:var(--ink);
  }
  html[lang="ar"] body{font-family:"Geeza Pro","Noto Naskh Arabic","Noto Sans Arabic","Al Bayan","Baghdad","Segoe UI","Tahoma","Arial",sans-serif}
  button{font-family:inherit;border:none;cursor:pointer;color:inherit}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
    height:100%;height:100dvh}
  .screen.active{display:flex}
  .topbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:76px}
  .round{width:72px;height:72px;border-radius:50%;font-size:38px;background:#fff;
    box-shadow:0 6px 0 rgba(0,0,0,.12),0 8px 18px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;transition:transform .1s}
  .round:active{transform:translateY(4px) scale(.96);box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .round.small{width:60px;height:60px;font-size:30px}
  .starcount{font-size:40px;font-weight:800;background:#fff;border-radius:40px;padding:6px 22px;
    box-shadow:0 6px 0 rgba(0,0,0,.1);display:flex;align-items:center;gap:8px}
  .starcount .s{display:inline-block}
  .starcount.bump .s{animation:bump .6s}
  @keyframes bump{40%{transform:scale(1.6) rotate(20deg)}}
  .langswitch{display:flex;background:#fff;border-radius:40px;padding:4px;box-shadow:0 6px 0 rgba(0,0,0,.1);flex-shrink:0}
  .langswitch button{padding:10px 16px;border-radius:32px;font-size:18px;font-weight:800;background:transparent;min-width:64px;min-height:44px}
  .langswitch button.on{background:var(--purple);color:#fff}

  .title{font-size:clamp(40px,9vw,84px);font-weight:900;margin:4px 0 10px;text-align:center;letter-spacing:1px}
  .title .ttl{font-size:clamp(28px,7vw,52px);margin-top:2px;letter-spacing:0}

function ac(){ if(!actx){ var C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); } if(actx&&actx.state==="suspended") actx.resume(); return actx; }
function tone(freq,start,dur,vol,type){
  var c=ac(); if(!c||settings.sfx!=="on") return;
  var t0=c.currentTime+start,o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.08,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.05);
}
function sfxTap(){ tone(660,0,0.15,0.05); }
function sfxYay(){ [523,659,784,1047].forEach(function(f,i){tone(f,i*0.09,0.35,0.07,"triangle");}); }
function sfxSoft(){ tone(392,0,0.2,0.04); tone(349,0.12,0.25,0.035); }

/* ---------- Speech ---------- */
var synth=window.speechSynthesis||null;
var voiceEn=null, voiceAr=null;
function pickVoices(){
  if(!synth) return;
  var vs=synth.getVoices()||[]; if(!vs.length) return;
  var en=vs.filter(function(v){return /^en[-_]US/i.test(v.lang);});
  var prefs=["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Allison","Ava","Karen","Zira"];
  voiceEn=null;
  for(var p=0;p<prefs.length;p++){ for(var i=0;i<en.length;i++){ if(en[i].name.indexOf(prefs[p])>=0){voiceEn=en[i];break;} } if(voiceEn) break; }
  if(!voiceEn) voiceEn=en.find(function(v){return v.localService;})||en[0]||vs.find(function(v){return /^en/i.test(v.lang);})||null;
  var ar=vs.filter(function(v){return /^ar([-_]|$)/i.test(v.lang);});
  var order=[/^ar[-_]SA/i,/^ar[-_]EG/i,/^ar[-_](SY|LB|JO|PS)/i,/^ar[-_]AE/i,/^ar/i];
  voiceAr=null;
  for(var o=0;o<order.length;o++){
    var m=ar.filter(function(v){return order[o].test(v.lang);});
    if(m.length){ voiceAr=m.find(function(v){return v.localService;})||m[0]; break; }
  }
}
if(synth){ pickVoices(); if("onvoiceschanged" in synth) synth.onvoiceschanged=function(){pickVoices();syncPanel();}; setTimeout(pickVoices,500); setTimeout(pickVoices,1500); }
var speakSeq=0;
function currentVoice(){ return settings.lang==="ar" ? voiceAr : voiceEn; }
function say(parts,onDone){
  if(!synth){ if(onDone) setTimeout(onDone,600); return; }
  if(typeof parts==="string") parts=[parts];
  var my=++speakSeq; synth.cancel(); pickVoices();
  var i=0, voice=currentVoice();
  function next(){
    if(my!==speakSeq) return;
    if(i>=parts.length){ if(onDone) onDone(); return; }
    var u=new SpeechSynthesisUtterance(parts[i++]);
    if(voice){u.voice=voice;u.lang=voice.lang;} else u.lang=settings.lang==="ar"?"ar-SA":"en-US";
    u.rate=settings.lang==="ar"?0.8:0.85; u.pitch=1.12; u.volume=1;
    var fired=false; function go(){ if(fired) return; fired=true; setTimeout(next,200); }
    u.onend=go; u.onerror=go; setTimeout(go,1400+parts[i-1].length*140);
    synth.speak(u);
  }
  setTimeout(next,60);
}
function unlockAudio(){ ac(); if(synth){ try{ var u=new SpeechSynthesisUtterance(" "); u.volume=0; synth.speak(u);}catch(e){} } }

/* ---------- Stars & effects ---------- */
function renderStars(bump){
  document.querySelectorAll(".starcount").forEach(function(el){
    el.querySelector(".n").textContent = settings.lang==="ar" ? stars.toLocaleString("ar-EG") : String(stars);
    if(bump){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
  });
}
function addStar(){ stars++; store.set("stars",stars); renderStars(true); }
var fx=document.getElementById("fx");
function celebrate(){
  sfxYay();
  var big=document.createElement("div"); big.className="bigstar"; big.textContent="⭐";
  document.body.appendChild(big); setTimeout(function(){big.remove();},1400);
  var bits=["⭐","🌟","✨","🎉","💛","💜","💙","💚"], W=window.innerWidth, H=window.innerHeight;
  for(var i=0;i<36;i++){
    var p=document.createElement("div"); p.className="piece";
    if(i%3===0) p.textContent=bits[i%bits.length];
    else { p.style.width="14px"; p.style.height="20px"; p.style.borderRadius="4px"; p.style.background=COLORS[i%COLORS.length]; }
    p.style.left=(Math.random()*W)+"px"; fx.appendChild(p);
    var dx=(Math.random()-.5)*200, rot=Math.random()*720-360, dur=1400+Math.random()*1000;
    if(p.animate) p.animate([{transform:"translate(0,0) rotate(0)"},{transform:"translate("+dx+"px,"+(H+80)+"px) rotate("+rot+"deg)"}],{duration:dur,easing:"cubic-bezier(.2,.6,.4,1)",delay:Math.random()*250,fill:"forwards"});
    (function(el,d){setTimeout(function(){el.remove();},d+400);})(p,dur);
  }
}

/* ---------- Language / UI ---------- */
function applyLang(){
  var ar=settings.lang==="ar";
  document.documentElement.lang=ar?"ar":"en";
  document.documentElement.dir=ar?"rtl":"ltr";
  document.getElementById("lbExplore").textContent=t().explore;
  document.getElementById("lbMatch").textContent=t().match;
  document.getElementById("homeTitle").innerHTML='<span class="em">🐱</span> <span class="em">🍎</span><div class="ttl">'+t().title+'</div>';
  document.getElementById("closeWord").textContent=ar?"➡️":"⬅️";
  document.getElementById("wvPrev").textContent=ar?"⏩":"⏪";
  document.getElementById("wvNext").textContent=ar?"⏪":"⏩";
  document.getElementById("closeWord").setAttribute("aria-label",t().back);
  document.querySelectorAll("[data-home]").forEach(function(b){ b.setAttribute("aria-label",t().home); });
  document.getElementById("wvPrev").setAttribute("aria-label",t().prev);
  document.getElementById("wvNext").setAttribute("aria-label",t().next);
  document.getElementById("wvSay").setAttribute("aria-label",t().say);
  document.getElementById("matchSpeak").setAttribute("aria-label",t().say);
  document.getElementById("gear").setAttribute("aria-label",t().gear);
  document.getElementById("phTitle").textContent=t().parent;
  document.getElementById("phLang").textContent=t().lang;
  document.getElementById("phSet").textContent=t().set;
  document.getElementById("btnStarter").textContent=t().starter;
  document.getElementById("btnAll").textContent=t().all;
  document.getElementById("phN").textContent=t().n;
  document.getElementById("phSfx").textContent=t().sfx;
  document.getElementById("btnSfxOn").textContent=t().sfxOn;
  document.getElementById("btnSfxOff").textContent=t().sfxOff;
  document.getElementById("panelDone").textContent=t().done;
  document.getElementById("resetStars").textContent=t().reset;
  document.querySelectorAll(".langswitch button, #segLang button").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-lang")===settings.lang || b.getAttribute("data-v")===settings.lang);
  });
  if(location.hash.replace("#","")!==settings.lang){
    try{ history.replaceState(null,"","#"+settings.lang); }catch(e){ location.hash=settings.lang; }
  }
  renderStars(false);
}
function setLang(lang, speakHi){
  if(lang!=="en"&&lang!=="ar") return;
  settings.lang=lang; store.set("lang",lang);
  if(synth){ speakSeq++; synth.cancel(); }
  applyLang();
  if(current==="explore") buildGrid();
  if(current==="match") newMatch();
  if(document.getElementById("wordView").classList.contains("show")) openWord(wvIndex);
  if(speakHi) say(t().hi);
}

/* ---------- Navigation ---------- */
var current="home";
function show(id){
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.toggle("active",s.id===id); });
  document.getElementById("wordView").classList.remove("show");
  current=id; if(synth){speakSeq++;synth.cancel();}
  if(id==="explore") buildGrid();
  if(id==="match") newMatch();
  renderStars(false);
}
document.querySelectorAll("[data-go]").forEach(function(b){
  b.addEventListener("click",function(){ sfxTap(); show(b.getAttribute("data-go")); });
});
document.querySelectorAll("[data-home]").forEach(function(b){
  b.addEventListener("click",function(){ sfxTap(); show("home"); });
});

/* ---------- Explore ---------- */
var wvIndex=0;
function buildGrid(){
  var g=document.getElementById("grid"); g.innerHTML="";
  WORDS.forEach(function(x,i){
    var b=document.createElement("button"); b.className="tile";
    b.textContent=x.e; b.setAttribute("aria-label",wtxt(x));
    b.addEventListener("click",function(){ sfxTap(); openWord(i); });
    g.appendChild(b);
  });
}
function openWord(i){
  wvIndex=(i+WORDS.length)%WORDS.length;
  var x=WORDS[wvIndex], v=document.getElementById("wordView");
  document.getElementById("wvEmoji").textContent=x.e;
  document.getElementById("wvWord").innerHTML=highlight(wtxt(x));
  v.classList.remove("show"); void v.offsetWidth; v.classList.add("show");
  say(wtxt(x)+"!");
}
document.getElementById("closeWord").addEventListener("click",function(){ sfxTap(); speakSeq++; if(synth) synth.cancel(); document.getElementById("wordView").classList.remove("show"); });
document.getElementById("wvPrev").addEventListener("click",function(){ sfxTap(); openWord(wvIndex-1); });
document.getElementById("wvNext").addEventListener("click",function(){ sfxTap(); openWord(wvIndex+1); });
document.getElementById("wvSay").addEventListener("click",function(){ say(wtxt(WORDS[wvIndex])+"!"); });
document.getElementById("wvEmoji").addEventListener("click",function(){ say(wtxt(WORDS[wvIndex])+"!"); });

/* ---------- Match ---------- */
function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function pickChoices(target, pool){
  var n=settings.n===3?3:2;
  var tLetter=firstLetter(wtxt(target),settings.lang);
  var others=pool.filter(function(x){ return x.id!==target.id && firstLetter(wtxt(x),settings.lang)!==tLetter; });
  if(others.length<n-1) others=WORDS.filter(function(x){ return x.id!==target.id && firstLetter(wtxt(x),settings.lang)!==tLetter; });
  others=shuffle(others.slice());
  return shuffle([target].concat(others.slice(0,n-1)));
}
var lastTarget=null, matchTarget=null, locked=false;
function pickTarget(pool){
  var x,g=0; do{ x=pool[Math.floor(Math.random()*pool.length)]; }while(lastTarget && x.id===lastTarget.id && pool.length>1 && g++<20);
  lastTarget=x; return x;
}
function matchPrompt(){ return [wtxt(matchTarget)+"!"]; }
function newMatch(){
  if(current!=="match") return;
  locked=false;
  var pool=practicePool();
  matchTarget=pickTarget(pool);
  var pic=document.getElementById("matchPic");
  pic.textContent=matchTarget.e; pic.style.animation="none"; void pic.offsetWidth; pic.style.animation="pop .4s cubic-bezier(.3,1.6,.6,1)";
  var ch=pickChoices(matchTarget, pool);
  var c=document.getElementById("matchChoices"); c.innerHTML="";
  ch.forEach(function(x,i){
    var b=document.createElement("button"); b.className="wchoice";
    b.style.background=COLORS[(i*3+WORDS.indexOf(x))%COLORS.length];
    b.innerHTML=highlight(wtxt(x)); b.setAttribute("aria-label",wtxt(x)); b.dataset.id=x.id;
    b.addEventListener("click",function(){ onPick(b,x); });
    c.appendChild(b);
  });
  say(matchPrompt());
}
function onPick(btn,x){
  if(locked) return;
  if(x.id===matchTarget.id){
    locked=true; btn.classList.add("right");
    document.querySelectorAll("#matchChoices .wchoice").forEach(function(c){ if(c!==btn) c.classList.add("dim"); });
    celebrate(); addStar();
    var praise=t().praise[Math.floor(Math.random()*t().praise.length)];
    say([praise, wtxt(matchTarget)+"!"], function(){ setTimeout(function(){ locked=false; newMatch(); },300); });
    setTimeout(function(){ if(locked){ locked=false; newMatch(); } },7000);
  } else {
    sfxSoft(); btn.classList.remove("wiggle"); void btn.offsetWidth; btn.classList.add("wiggle");
    say([t().try[Math.floor(Math.random()*t().try.length)]].concat(matchPrompt()));
  }
}
document.getElementById("matchSpeak").addEventListener("click",function(){ if(matchTarget) say(matchPrompt()); });
document.getElementById("matchPic").addEventListener("click",function(){ if(matchTarget) say(matchPrompt()); });

/* ---------- Parent panel ---------- */
var panel=document.getElementById("panel");
function syncSeg(id,val){ document.querySelectorAll("#"+id+" button").forEach(function(b){ b.classList.toggle("on", String(b.dataset.v)===String(val)); }); }
function syncPanel(){
  syncSeg("segLang",settings.lang); syncSeg("segSet",settings.set); syncSeg("segN",settings.n); syncSeg("segSfx",settings.sfx);
  var vn=document.getElementById("voiceNote"), nv=document.getElementById("noVoice");
  var voice=currentVoice();
  if(!synth){ vn.textContent=t().noSynth; nv.hidden=true; return; }
  vn.textContent = voice ? t().voiceOk(voice.name,voice.lang,stars) : t().starsOnly(stars);
  nv.innerHTML=t().noAr;
  nv.hidden = !(settings.lang==="ar" && !voiceAr);
}
document.getElementById("gear").addEventListener("click",function(){ pickVoices(); applyLang(); syncPanel(); panel.classList.add("show"); });
document.getElementById("panelDone").addEventListener("click",function(){ panel.classList.remove("show"); });
document.getElementById("resetStars").addEventListener("click",function(){
  if(confirm(t().resetQ)){ stars=0; store.set("stars",0); renderStars(false); syncPanel(); }
});
function bindSeg(id,fn){
  document.querySelectorAll("#"+id+" button").forEach(function(b){ b.addEventListener("click",function(){ fn(b.dataset.v); syncPanel(); }); });
}
bindSeg("segLang",function(v){ setLang(v,false); });
bindSeg("segSet",function(v){ settings.set=v; store.set("set",v); });
bindSeg("segN",function(v){ settings.n=parseInt(v,10); store.set("n",settings.n); });
bindSeg("segSfx",function(v){ settings.sfx=v; store.set("sfx",v); });
document.querySelectorAll("#langHome button").forEach(function(b){
  b.addEventListener("click",function(){ sfxTap(); setLang(b.getAttribute("data-lang"),false); });
});
window.addEventListener("hashchange",function(){ var l=langFromHash(); if(l&&l!==settings.lang) setLang(l,false); });

/* ---------- Start ---------- */
document.getElementById("startBtn").addEventListener("click",function(){
  unlockAudio(); sfxYay(); document.getElementById("start").style.display="none";
  say(t().hi);
});
var unlocked=false;
function firstTouch(){ if(unlocked) return; unlocked=true; unlockAudio(); }
document.addEventListener("touchend",firstTouch,{passive:true});
document.addEventListener("click",firstTouch);
["gesturestart","gesturechange","gestureend"].forEach(function(ev){ document.addEventListener(ev,function(e){e.preventDefault();},{passive:false}); });
document.addEventListener("touchmove",function(e){ if(e.touches&&e.touches.length>1) e.preventDefault(); },{passive:false});
document.addEventListener("contextmenu",function(e){e.preventDefault();});
document.addEventListener("selectstart",function(e){ if(!(e.target&&e.target.closest&&e.target.closest(".card"))) e.preventDefault(); });

applyLang();
window.__words={WORDS:WORDS,STARTER:STARTER,settings:settings,show:show,openWord:openWord,setLang:setLang,wtxt:wtxt,firstLetter:firstLetter,pickChoices:pickChoices};
})();
</script>
