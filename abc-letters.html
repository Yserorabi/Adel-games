<meta name="theme-color" content="#ffd84d">
<title>Adel's ABC</title>
<style>
  :root{
    --bg1:#fff6c9; --bg2:#ffe0f0;
    --red:#ff6b6b; --orange:#ffa94d; --yellow:#ffd43b; --green:#51cf66;
    --teal:#20c997; --blue:#4dabf7; --purple:#9775fa; --pink:#f783ac;
    --ink:#3b2f5c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation}
  body{
    font-family:"Arial Rounded MT Bold","Nunito","Comic Sans MS","Chalkboard SE",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at 20% 10%,var(--bg1),var(--bg2) 70%);
    color:var(--ink);
  }
  button{font-family:inherit;border:none;cursor:pointer;color:inherit}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  .screen.active{display:flex}
  .topbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:76px}
  .round{width:72px;height:72px;border-radius:50%;font-size:38px;background:#fff;
    box-shadow:0 6px 0 rgba(0,0,0,.12),0 8px 18px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;transition:transform .1s}
  .round:active{transform:translateY(4px) scale(.96);box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .round.small{width:52px;height:52px;font-size:26px;opacity:.75}
  .starcount{font-size:40px;font-weight:800;background:#fff;border-radius:40px;padding:6px 22px;
    box-shadow:0 6px 0 rgba(0,0,0,.1);display:flex;align-items:center;gap:8px}
  .starcount .s{display:inline-block}
  .starcount.bump .s{animation:bump .6s}
  @keyframes bump{40%{transform:scale(1.6) rotate(20deg)}}

  /* Home */
  .title{font-size:clamp(44px,10vw,96px);font-weight:900;margin:4px 0 10px;letter-spacing:4px;text-align:center}
  .title span{display:inline-block;animation:float 3s ease-in-out infinite}
  .title span:nth-child(2){animation-delay:.3s}.title span:nth-child(3){animation-delay:.6s}
  @keyframes float{50%{transform:translateY(-10px)}}
  .modes{flex:1;width:100%;max-width:1100px;display:flex;gap:4vmin;align-items:center;justify-content:center;flex-wrap:wrap}
  .mode{flex:1 1 240px;max-width:340px;min-height:min(46vh,300px);border-radius:44px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;color:#fff;box-shadow:0 12px 0 rgba(0,0,0,.15);transition:transform .12s}
  .mode:active{transform:translateY(8px);box-shadow:0 4px 0 rgba(0,0,0,.15)}
  .mode .ic{font-size:clamp(70px,14vmin,120px);line-height:1}
  .mode .lb{font-size:22px;font-weight:800;opacity:.95;text-shadow:0 2px 0 rgba(0,0,0,.15)}
  .m1{background:linear-gradient(160deg,#74c0fc,#4dabf7 60%,#339af0)}
  .m2{background:linear-gradient(160deg,#8ce99a,#51cf66 60%,#40c057)}
  .m3{background:linear-gradient(160deg,#ffc078,#ffa94d 60%,#fd7e14)}
  @media (max-height:560px) and (orientation:landscape){
    .mode{min-height:60vh}.title{font-size:44px;margin:0}
  }

  /* Explore grid */
  .grid{flex:1;width:100%;max-width:1100px;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(min(108px,22vw),1fr));gap:14px;padding:10px 4px 30px;align-content:start}
  .tile{aspect-ratio:1;border-radius:28px;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:row;
    box-shadow:0 7px 0 rgba(0,0,0,.15);transition:transform .1s;font-weight:900}
  .tile:active{transform:translateY(5px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .tile .up{font-size:clamp(40px,9vw,64px);line-height:1}
  .tile .lo{font-size:clamp(24px,5vw,36px);opacity:.85;margin-left:4px;align-self:flex-end;margin-bottom:22%}

  /* Letter big view */
  .overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#fffdf3,#fff1d6);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;
    padding:max(12px,env(safe-area-inset-top)) 12px 12px}
  .overlay.show{display:flex;animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}}
  .overlay .topbar{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;width:auto}
  .bigrow{display:flex;align-items:center;justify-content:center;gap:4vmin;flex-wrap:wrap}
  .bigletter{font-size:min(42vmin,300px);font-weight:900;line-height:1;text-shadow:0 8px 0 rgba(0,0,0,.12)}
  .bigletter .lo{font-size:.6em;margin-left:.08em}
  .bigemoji{font-size:min(34vmin,240px);line-height:1;animation:wobble 2.4s ease-in-out infinite}
  @keyframes wobble{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  .word{font-size:min(10vmin,64px);font-weight:900;margin-top:2vmin;letter-spacing:2px}
  .word b{color:var(--red)}
  .navrow{display:flex;gap:24px;margin-top:3vmin}
  .round.big{width:96px;height:96px;font-size:50px}

  /* Quiz */
  .stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin}
  .prompt{display:flex;align-items:center;gap:4vmin}
  .speaker{width:min(26vmin,150px);height:min(26vmin,150px);border-radius:50%;font-size:min(13vmin,76px);background:var(--yellow);
    box-shadow:0 10px 0 #f0b400;display:flex;align-items:center;justify-content:center;animation:pulse 2s infinite}
  .speaker:active{transform:translateY(6px);box-shadow:0 4px 0 #f0b400}
  @keyframes pulse{50%{transform:scale(1.06)}}
  .picture{font-size:min(36vmin,220px);line-height:1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.08))}
  .choices{display:flex;gap:4vmin;flex-wrap:wrap;justify-content:center}
  .choice{width:min(28vmin,200px);height:min(28vmin,200px);min-width:110px;min-height:110px;border-radius:36px;color:#fff;
    font-size:min(18vmin,130px);font-weight:900;box-shadow:0 10px 0 rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;transition:transform .1s}
  .choice:active{transform:translateY(6px)}
  .choice .lo{font-size:.6em;margin-left:.05em}
  .choice.wiggle{animation:wiggle .5s}
  @keyframes wiggle{20%{transform:rotate(-10deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
  .choice.right{animation:yay .8s;outline:10px solid #fff}
  @keyframes yay{30%{transform:scale(1.25) rotate(-6deg)}60%{transform:scale(1.15) rotate(6deg)}}
  .choice.dim{opacity:.35}

  /* Confetti */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
  .piece{position:absolute;top:-40px;will-change:transform;font-size:34px}
  .bigstar{position:fixed;left:50%;top:50%;font-size:min(50vmin,300px);transform:translate(-50%,-50%) scale(0);z-index:51;pointer-events:none;
    animation:bigstar 1.3s ease-out forwards}
  @keyframes bigstar{30%{transform:translate(-50%,-50%) scale(1.1) rotate(20deg)}60%{transform:translate(-50%,-50%) scale(1) rotate(-10deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.3) rotate(0);opacity:0}}

  /* Parent panel */
  .panel{position:fixed;inset:0;background:rgba(40,30,70,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
  .panel.show{display:flex}
  .card{background:#fff;border-radius:28px;padding:22px 24px;max-width:520px;width:100%;max-height:92vh;overflow:auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .card h2{margin:0 0 6px;font-size:22px}
  .card h3{margin:18px 0 8px;font-size:16px;color:#6b5f8a}
  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .seg button{padding:12px 16px;border-radius:14px;background:#f1edfb;font-size:16px;font-weight:700}
  .seg button.on{background:var(--purple);color:#fff}
  .card .note{font-size:13px;color:#7a7090;margin-top:14px;line-height:1.4}
  .card .done{margin-top:18px;width:100%;padding:14px;border-radius:16px;background:var(--green);color:#fff;font-size:18px;font-weight:800}

<script>
(function(){
"use strict";

/* ---------- Data ---------- */
// name: how TTS should say the letter name; snd: phonics sound spelled for TTS
var LETTERS = [
  {L:"A",name:"ay",     snd:"ah",   word:"apple",    e:"🍎"},
  {L:"B",name:"bee",    snd:"buh",  word:"ball",     e:"⚽"},
  {L:"C",name:"see",    snd:"kuh",  word:"cat",      e:"🐱"},
  {L:"D",name:"dee",    snd:"duh",  word:"dog",      e:"🐶"},
  {L:"E",name:"ee",     snd:"eh",   word:"egg",      e:"🥚"},
  {L:"F",name:"eff",    snd:"fuh",  word:"fish",     e:"🐟"},
  {L:"G",name:"jee",    snd:"guh",  word:"goat",     e:"🐐"},
  {L:"H",name:"aitch",  snd:"huh",  word:"hat",      e:"🎩"},
  {L:"I",name:"eye",    snd:"ih",   word:"insect",   e:"🐛"},
  {L:"J",name:"jay",    snd:"juh",  word:"juice",    e:"🧃"},
  {L:"K",name:"kay",    snd:"kuh",  word:"kite",     e:"🪁"},
  {L:"L",name:"el",     snd:"luh",  word:"lion",     e:"🦁"},
  {L:"M",name:"em",     snd:"muh",  word:"moon",     e:"🌙"},
  {L:"N",name:"en",     snd:"nuh",  word:"nose",     e:"👃"},
  {L:"O",name:"oh",     snd:"aw",   word:"octopus",  e:"🐙"},
  {L:"P",name:"pee",    snd:"puh",  word:"pig",      e:"🐷"},
  {L:"Q",name:"cue",    snd:"kwuh", word:"queen",    e:"👸"},
  {L:"R",name:"ar",     snd:"ruh",  word:"rabbit",   e:"🐰"},
  {L:"S",name:"ess",    snd:"sss",  word:"sun",      e:"☀️"},
  {L:"T",name:"tee",    snd:"tuh",  word:"tiger",    e:"🐯"},
  {L:"U",name:"you",    snd:"uh",   word:"umbrella", e:"☂️"},
  {L:"V",name:"vee",    snd:"vuh",  word:"violin",   e:"🎻"},
  {L:"W",name:"double you", snd:"wuh", word:"whale", e:"🐳"},
  {L:"X",name:"ex",     snd:"ks",   word:"fox",      e:"🦊", end:true},
  {L:"Y",name:"why",    snd:"yuh",  word:"yo-yo",    e:"🪀"},
  {L:"Z",name:"zee",    snd:"zuh",  word:"zebra",    e:"🦓"}
];
var STARTER = ["A","B","C","D","E","M","S","T"];
var COLORS = ["#ff6b6b","#ffa94d","#f4b400","#51cf66","#20c997","#4dabf7","#9775fa","#f783ac","#5c7cfa","#ff8787"];
var PRAISE = ["Great job, Adel!","Yay! You did it, Adel!","Super, Adel!","Wow! Amazing, Adel!","You got it, Adel!","High five, Adel!"];
var TRY = ["Let's try again!","Almost! Try again!","Ooh, good try!"];
function byL(l){for(var i=0;i<LETTERS.length;i++) if(LETTERS[i].L===l) return LETTERS[i];}
function colorFor(l){return COLORS[(l.charCodeAt(0)-65)%COLORS.length];}

/* ---------- Settings / storage ---------- */
var store = {
  get:function(k,d){try{var v=localStorage.getItem("adelabc_"+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem("adelabc_"+k,JSON.stringify(v));}catch(e){}}
};
var settings = {
  caseMode: store.get("case","both"),
  set: store.get("set","starter"),
  n: store.get("n",3),
  sfx: store.get("sfx","on")
};
var stars = store.get("stars",0);

function letterHTML(l){
  if(settings.caseMode==="upper") return l;
  if(settings.caseMode==="lower") return l.toLowerCase();
  return l+'<span class="lo">'+l.toLowerCase()+'</span>';
}
function practicePool(){ return settings.set==="all" ? LETTERS.map(function(x){return x.L;}) : STARTER.slice(); }

/* ---------- Audio (Web Audio chimes) ---------- */
var actx=null;
function ac(){ if(!actx){ var C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); } if(actx&&actx.state==="suspended") actx.resume(); return actx; }
function tone(freq,start,dur,vol,type){
  var c=ac(); if(!c||settings.sfx!=="on") return;
  var t=c.currentTime+start, o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.08,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.05);
}
function sfxTap(){ tone(660,0,0.15,0.05); }
function sfxYay(){ [523,659,784,1047].forEach(function(f,i){tone(f,i*0.09,0.35,0.07,"triangle");}); }
function sfxSoft(){ tone(392,0,0.2,0.04); tone(349,0.12,0.25,0.035); }

/* ---------- Speech ---------- */
var synth = window.speechSynthesis || null;
var voice = null;
function pickVoice(){
  if(!synth) return;
  var vs = synth.getVoices()||[]; if(!vs.length) return;
  var en = vs.filter(function(v){return /^en[-_]US/i.test(v.lang);});
  var prefs=["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Allison","Ava","Karen","Zira"];
  for(var p=0;p<prefs.length;p++){ for(var i=0;i<en.length;i++){ if(en[i].name.indexOf(prefs[p])>=0){voice=en[i];return;} } }
  voice = en.find(function(v){return v.localService;}) || en[0] || vs.find(function(v){return /^en/i.test(v.lang);}) || vs[0];
}
if(synth){ pickVoice(); if("onvoiceschanged" in synth) synth.onvoiceschanged=pickVoice; setTimeout(pickVoice,500); setTimeout(pickVoice,1500); }
var speakSeq=0;
function say(parts, onDone){
  // parts: array of strings (spoken with short pauses)
  if(!synth){ if(onDone) setTimeout(onDone,600); return; }
  if(typeof parts==="string") parts=[parts];
  var my=++speakSeq;
  synth.cancel();
  if(!voice) pickVoice();
  var i=0;
  function next(){
    if(my!==speakSeq) return;
    if(i>=parts.length){ if(onDone) onDone(); return; }
    var u=new SpeechSynthesisUtterance(parts[i++]);
    if(voice){u.voice=voice;u.lang=voice.lang;} else u.lang="en-US";
    u.rate=0.85; u.pitch=1.15; u.volume=1;
    var fired=false;
    function go(){ if(fired) return; fired=true; setTimeout(next,180); }
    u.onend=go; u.onerror=go;
    // safety in case onend never fires (some Android builds)
    setTimeout(go, 1200 + parts[i-1].length*120);
    synth.speak(u);
  }
  // small delay after cancel avoids Chrome dropping the utterance
  setTimeout(next,60);
}
function unlockAudio(){
  ac();
  if(synth){ try{ var u=new SpeechSynthesisUtterance(" "); u.volume=0; synth.speak(u); }catch(e){} }
}

/* ---------- Stars ---------- */
function renderStars(bump){
  var els=document.querySelectorAll(".starcount");
  for(var i=0;i<els.length;i++){
    els[i].querySelector(".n").textContent=stars;
    if(bump){ els[i].classList.remove("bump"); void els[i].offsetWidth; els[i].classList.add("bump"); }
  }
}
function addStar(){ stars++; store.set("stars",stars); renderStars(true); }

/* ---------- Effects ---------- */
var fx=document.getElementById("fx");
function celebrate(){
  sfxYay();
  var big=document.createElement("div"); big.className="bigstar"; big.textContent="⭐";
  document.body.appendChild(big); setTimeout(function(){big.remove();},1400);
  var bits=["⭐","🌟","✨","🎉","💛","💜","💙","💚"];
  var W=window.innerWidth,H=window.innerHeight;
  for(var i=0;i<36;i++){
    var p=document.createElement("div"); p.className="piece";
    if(i%3===0){ p.textContent=bits[i%bits.length]; }
    else { p.style.width="14px"; p.style.height="20px"; p.style.borderRadius="4px"; p.style.background=COLORS[i%COLORS.length]; }
    p.style.left=(Math.random()*W)+"px";
    fx.appendChild(p);
    var dx=(Math.random()-.5)*200, rot=(Math.random()*720-360), dur=1400+Math.random()*1000;
    if(p.animate){
      p.animate([{transform:"translate(0,0) rotate(0)"},{transform:"translate("+dx+"px,"+(H+80)+"px) rotate("+rot+"deg)"}],
        {duration:dur,easing:"cubic-bezier(.2,.6,.4,1)",delay:Math.random()*250,fill:"forwards"});
    }
    (function(el,d){setTimeout(function(){el.remove();},d+400);})(p,dur);
  }
}

/* ---------- Navigation ---------- */
var current="home";
function show(id){
  var s=document.querySelectorAll(".screen");
  for(var i=0;i<s.length;i++) s[i].classList.toggle("active",s[i].id===id);
  document.getElementById("letterView").classList.remove("show");
  current=id;
  if(synth) { speakSeq++; synth.cancel(); }
  if(id==="explore") buildGrid();
  if(id==="find") newFind();
  if(id==="sounds") newSound();
  renderStars(false);
}
document.querySelectorAll("[data-go]").forEach(function(b){
  b.addEventListener("click",function(){ sfxTap(); show(b.getAttribute("data-go")); });
});
document.querySelectorAll("[data-home]").forEach(function(b){
  b.addEventListener("click",function(){ sfxTap(); show("home"); });
});

/* ---------- Explore ---------- */
var lvIndex=0;
function buildGrid(){
  var g=document.getElementById("grid"); g.innerHTML="";
  LETTERS.forEach(function(x,i){
    var b=document.createElement("button"); b.className="tile"; b.style.background=colorFor(x.L);
    b.setAttribute("aria-label",x.L);
    if(settings.caseMode==="upper") b.innerHTML='<span class="up">'+x.L+'</span>';
    else if(settings.caseMode==="lower") b.innerHTML='<span class="up">'+x.L.toLowerCase()+'</span>';
    else b.innerHTML='<span class="up">'+x.L+'</span><span class="lo">'+x.L.toLowerCase()+'</span>';
    b.addEventListener("click",function(){ sfxTap(); openLetter(i); });
    g.appendChild(b);
  });
}
function explorePhrase(x){
  var p=[x.name+".", x.name+" says, "+x.snd+"."];
  p.push(x.end ? "You can hear "+x.name+" at the end of "+x.word+". "+x.word+"!" : x.name+" is for "+x.word+"!");
  return p;
}
function openLetter(i){
  lvIndex=(i+LETTERS.length)%LETTERS.length;
  var x=LETTERS[lvIndex], v=document.getElementById("letterView");
  var bl=document.getElementById("lvLetter");
  bl.innerHTML=letterHTML(x.L); bl.style.color=colorFor(x.L);
  document.getElementById("lvEmoji").textContent=x.e;
  var w=x.word, idx=x.end? w.toLowerCase().lastIndexOf(x.L.toLowerCase()) : 0;
  document.getElementById("lvWord").innerHTML = w.slice(0,idx)+"<b>"+w.charAt(idx)+"</b>"+w.slice(idx+1);
  v.classList.remove("show"); void v.offsetWidth; v.classList.add("show");
  say(explorePhrase(x));
}
document.getElementById("closeLetter").addEventListener("click",function(){ sfxTap(); speakSeq++; if(synth) synth.cancel(); document.getElementById("letterView").classList.remove("show"); });
document.getElementById("lvPrev").addEventListener("click",function(){ sfxTap(); openLetter(lvIndex-1); });
document.getElementById("lvNext").addEventListener("click",function(){ sfxTap(); openLetter(lvIndex+1); });
document.getElementById("lvSay").addEventListener("click",function(){ say(explorePhrase(LETTERS[lvIndex])); });
document.getElementById("lvEmoji").addEventListener("click",function(){ var x=LETTERS[lvIndex]; say(x.word+"!"); });

/* ---------- Quiz helpers ---------- */
function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function pickChoices(target, pool){
  var n=Math.max(2,Math.min(4,settings.n|0||3));
  var others=pool.filter(function(l){return l!==target;});
  if(others.length<n-1){ others=LETTERS.map(function(x){return x.L;}).filter(function(l){return l!==target && others.indexOf(l)<0;}).concat(others); others=shuffle(others); }
  // avoid two letters with the same sound (C/K) in the same round
  var sameSound={C:"K",K:"C"};
  others=shuffle(others).filter(function(l){return sameSound[target]!==l;});
  return shuffle([target].concat(others.slice(0,n-1)));
}
var lastTarget=null;
function pickTarget(pool){
  var t; var guard=0;
  do{ t=pool[Math.floor(Math.random()*pool.length)]; }while(t===lastTarget && pool.length>1 && guard++<20);
  lastTarget=t; return t;
}
function renderChoices(container, letters, onPick){
  container.innerHTML="";
  container.setAttribute("data-n",letters.length);
  letters.forEach(function(l,i){
    var b=document.createElement("button"); b.className="choice";
    b.style.background=COLORS[(i*3+l.charCodeAt(0))%COLORS.length];
    b.innerHTML=letterHTML(l); b.setAttribute("aria-label",l); b.dataset.l=l;
    b.addEventListener("click",function(){ onPick(b,l); });
    container.appendChild(b);
  });
}
var locked=false;
function handlePick(container, btn, l, target, promptFn, nextFn){
  if(locked) return;
  if(l===target){
    locked=true;
    btn.classList.add("right");
    container.querySelectorAll(".choice").forEach(function(c){ if(c!==btn) c.classList.add("dim"); });
    celebrate(); addStar();
    var x=byL(target);
    var praise=PRAISE[Math.floor(Math.random()*PRAISE.length)];
    say([praise, x.name+" is for "+x.word+"!"], function(){ setTimeout(function(){ locked=false; nextFn(); },300); });
    // fallback if speech doesn't finish
    setTimeout(function(){ if(locked){ locked=false; nextFn(); } },6500);
  } else {
    sfxSoft();
    btn.classList.remove("wiggle"); void btn.offsetWidth; btn.classList.add("wiggle");
    say([TRY[Math.floor(Math.random()*TRY.length)]].concat(promptFn()));
  }
}

/* ---------- Mode 2: Find the letter ---------- */
var findTarget=null;
function findPrompt(){ return ["Find the letter "+byL(findTarget).name+"!"]; }
function newFind(){
  if(current!=="find") return;
  findTarget=pickTarget(practicePool());
  var ch=pickChoices(findTarget, practicePool());
  var c=document.getElementById("findChoices");
  renderChoices(c, ch, function(btn,l){ handlePick(c,btn,l,findTarget,findPrompt,newFind); });
  say(findPrompt());
}
document.getElementById("findSpeak").addEventListener("click",function(){ say(findPrompt()); });

/* ---------- Mode 3: Letter sounds ---------- */
var soundTarget=null;
function soundPrompt(){ var x=byL(soundTarget); return ["What does "+x.word+" start with?"]; }
function newSound(){
  if(current!=="sounds") return;
  var pool=practicePool().filter(function(l){ return !byL(l).end; }); // skip X (fox ends with x)
  soundTarget=pickTarget(pool);
  var x=byL(soundTarget), pic=document.getElementById("soundPic");
  pic.textContent=x.e; pic.style.animation="none"; void pic.offsetWidth; pic.style.animation="pop .4s cubic-bezier(.3,1.6,.6,1)";
  var ch=pickChoices(soundTarget, pool);
  var c=document.getElementById("soundChoices");
  renderChoices(c, ch, function(btn,l){ handlePick(c,btn,l,soundTarget,soundPrompt,newSound); });
  say(soundPrompt());
}
document.getElementById("soundSpeak").addEventListener("click",function(){ say(soundPrompt()); });
document.getElementById("soundPic").addEventListener("click",function(){ say(byL(soundTarget).word+"!"); });

/* ---------- Parent panel ---------- */
var panel=document.getElementById("panel");
function syncSeg(id,val){ document.querySelectorAll("#"+id+" button").forEach(function(b){ b.classList.toggle("on", String(b.dataset.v)===String(val)); }); }
function syncPanel(){
  syncSeg("segCase",settings.caseMode); syncSeg("segSet",settings.set); syncSeg("segN",settings.n); syncSeg("segSfx",settings.sfx);
  document.getElementById("voiceNote").textContent = !synth ? "This browser has no speech voice, so letters won't be spoken." :
    ("Voice: "+(voice? voice.name+" ("+voice.lang+")" : "device default")+". Stars earned: "+stars+". Tip: on iPhone/iPad, turn off silent mode to hear the chimes.");
}
function bindSeg(id,key,store_k,num){
  document.querySelectorAll("#"+id+" button").forEach(function(b){
    b.addEventListener("click",function(){ var v=num?parseInt(b.dataset.v,10):b.dataset.v; settings[key]=v; store.set(store_k,v); syncPanel(); });
  });
}
bindSeg("segCase","caseMode","case"); bindSeg("segSet","set","set"); bindSeg("segN","n","n",true); bindSeg("segSfx","sfx","sfx");
document.getElementById("gear").addEventListener("click",function(){ pickVoice(); syncPanel(); panel.classList.add("show"); });
document.getElementById("panelDone").addEventListener("click",function(){ panel.classList.remove("show"); });
document.getElementById("resetStars").addEventListener("click",function(){ if(confirm("Reset the star count to 0?")){ stars=0; store.set("stars",0); renderStars(false); syncPanel(); } });

/* ---------- Start (unlocks audio on iOS) ---------- */
document.getElementById("startBtn").addEventListener("click",function(){
  unlockAudio(); sfxYay();
  document.getElementById("start").style.display="none";
  say("Hi Adel! Let's play with letters!");
});
// any first touch also unlocks, just in case
var unlocked=false;
function firstTouch(){ if(unlocked) return; unlocked=true; unlockAudio(); }
document.addEventListener("touchend",firstTouch,{passive:true});
document.addEventListener("click",firstTouch);

renderStars(false);
window.__abc={LETTERS:LETTERS,show:show,openLetter:openLetter};
})();
</script>
<script id="phonejs">
/* ==== phone layer ==== */
(function(){
  // block pinch-zoom on iOS Safari (it ignores user-scalable=no)
  ["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();},{passive:false});});
  document.addEventListener("touchmove",function(e){ if(e.touches&&e.touches.length>1) e.preventDefault(); },{passive:false});
  document.addEventListener("contextmenu",function(e){e.preventDefault();});
  document.addEventListener("selectstart",function(e){ if(!(e.target&&e.target.closest&&e.target.closest(".card"))) e.preventDefault(); });
})();
/* ==== /phone layer ==== */
</script>
